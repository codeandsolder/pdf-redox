[workspace]
resolver = "2"
members = [
  "crates/pdf-redox",
  "crates/pdf-redox-cli",
  "crates/pdf-redox-wasm",
]
exclude = ["third_party/flpdf", "third_party/hayro-syntax"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
flpdf = { version = "0.5.1", path = "third_party/flpdf/crates/flpdf" }
hayro-syntax = { path = "third_party/hayro-syntax", default-features = false, features = ["std"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReader", "HtmlInputElement", "Url", "Window", "Document"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
