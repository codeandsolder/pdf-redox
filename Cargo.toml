[workspace]
resolver = "3"
members = [
  "crates/pdf-redox",
  "crates/pdf-redox-cli",
  "crates/pdf-redox-wasm",
]
exclude = ["third_party/hayro-syntax"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/pdf-redox"
version = "0.1.0"

[workspace.dependencies]
hayro-syntax = { git = "https://github.com/codeandsolder/hayro", branch = "pdf-redox/zero-flpdf-base", default-features = false, features = ["std", "images"] }
# Keep flate2's default miniz_oxide backend. zlib-rs levels 3-6 can hit a severe
# ratio cliff on large repetitive PDF content without an end-to-end speed win.
flate2 = "1.1"
libjpeg-turbo-rs = "=0.8.0"
fast_image_resize = "6.1"
fax = "=0.3.0"
sha2 = "0.11"
smallvec = "1.16"
skera = { git = "https://github.com/codeandsolder/fontations", branch = "main" }
skrifa = { git = "https://github.com/codeandsolder/fontations", branch = "main" }
write-fonts = { git = "https://github.com/codeandsolder/fontations", branch = "main", default-features = false, features = ["read"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# Fast optimized profile for corpus A/Bs and performance work. Keep production
# release settings untouched, but avoid paying ThinLTO + single-CGU link cost
# on every experimental candidate.
[profile.validation]
inherits = "release"
codegen-units = 16
incremental = true
lto = false
strip = "none"
