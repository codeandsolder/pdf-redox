[workspace]
resolver = "3"
members = [
  "crates/pdf-redox",
  "crates/pdf-redox-cli",
  "crates/pdf-redox-wasm",
]
exclude = ["third_party/hayro-syntax"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeandsolder/pdf-redox"
version = "0.1.0"

[workspace.dependencies]
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, features = ["std", "images"] }
# Use our zlib-rs line directly so independent PDF streams can use its exact batch API.
# Processing remains level 7; Size remains level 9.
zlib-rs = { git = "https://github.com/codeandsolder/zlib-rs-fast", rev = "ee49f31014c79ee14d15b1124cecfdf3258f9d1b", default-features = false, features = ["std"] }
libjpeg-turbo-rs = "=0.9.0"
fast_image_resize = "6.1"
fax = "=0.3.0"
sha2 = "0.11"
smallvec = "1.16"
skera = "0.9"
skrifa = "0.49"
write-fonts = { version = "0.55", default-features = false, features = ["read"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
color_quant = "2.0"
num-traits = "0.2"

# Temporary upstream syntax fixes; see third_party/hayro-patches.
[patch."https://github.com/LaurenzV/hayro"]
hayro-syntax = { path = "third_party/hayro-syntax" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

# Fast optimized profile for corpus A/Bs and performance work. Keep production
# release settings untouched, but avoid paying ThinLTO + single-CGU link cost
# on every experimental candidate.
[profile.validation]
inherits = "release"
codegen-units = 16
incremental = false
lto = false
strip = "none"
