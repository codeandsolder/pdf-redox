[package]
name = "pdf-redox"
description = "Pure-Rust PDF normalization, optimization, diagnostics, and privacy scrubbing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hayro-syntax.workspace = true
zlib-rs.workspace = true
libjpeg-turbo-rs.workspace = true
fast_image_resize.workspace = true
fax.workspace = true
sha2.workspace = true
smallvec.workspace = true
skera.workspace = true
write-fonts.workspace = true
serde.workspace = true
thiserror.workspace = true
color_quant.workspace = true
num-traits.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
zlib-rs = { workspace = true, features = ["parallel"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen.workspace = true

[dev-dependencies]
serde_json.workspace = true
