[package]
name = "pdf-redox-cli"
description = "CLI for pdf-redox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "pdf-redox"
path = "src/main.rs"
doc = false

[[bin]]
name = "pdf-redox-ocr-overlay"
path = "src/ocr_overlay.rs"
doc = false

[[bin]]
name = "pdf-redox-glyph-labels"
path = "src/glyph_labels.rs"
doc = false

[features]
gpu = ["pdf-redox/gpu"]
cuda = ["gpu", "pdf-redox/cuda"]

[dependencies]
pdf-redox = { path = "../pdf-redox" }
clap.workspace = true
serde_json.workspace = true
serde.workspace = true

[[bin]]
name = "pdf-redox-compression-corpus"
path = "src/compression_corpus.rs"
doc = false

[[example]]
name = "flate_session_bench"
required-features = ["gpu"]
