[package]
name = "pdf-redox-wasm"
description = "WASM bindings for pdf-redox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf-redox = { path = "../pdf-redox" }
wasm-bindgen.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
console_error_panic_hook.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# flpdf uses getrandom for encryption IV generation. Browser WASM has no OS RNG,
# so opt its transitive getrandom dependency into the Web Crypto/JS backend.
getrandom = { version = "0.4", features = ["wasm_js"] }
