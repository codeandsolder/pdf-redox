[package]
name = "hayro-syntax"
version = "0.7.2"
description = "A low-level crate for reading PDF files."
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/LaurenzV/hayro"
license = "Apache-2.0 OR MIT"
readme = "README.md"

[features]
default = ["std", "images"]
std = ["hayro-jbig2?/std", "hayro-jpeg2000?/std", "dep:rustc-hash", "zune-jpeg?/std"]
images = ["dep:zune-jpeg", "dep:hayro-ccitt", "dep:hayro-jbig2", "dep:hayro-jpeg2000"]
unsafe = ["std", "dep:flate2", "dep:memchr", "hayro-jbig2?/simd", "hayro-jpeg2000?/simd", "zune-jpeg?/x86", "zune-jpeg?/neon"]
logging = ["dep:log", "hayro-jpeg2000?/logging"]

[dependencies]
log = { version = "0.4", optional = true }
rustc-hash = { version = "2", optional = true }
smallvec = "1"
flate2 = { version = "1", optional = true, features = ["zlib-rs"] }
memchr = { version = "2.8.0", default-features = false, features = ["alloc"], optional = true }
zune-jpeg = { version = "0.5", default-features = false, optional = true }
hayro-ccitt = { version = "0.3.0", default-features = false, optional = true }
hayro-jbig2 = { version = "0.3.0", default-features = false, optional = true }
hayro-jpeg2000 = { version = "0.4.0", default-features = false, optional = true }
