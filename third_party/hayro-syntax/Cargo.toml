[package]
name = "hayro-syntax"
version = "0.9.0"
description = "A low-level crate for reading PDF files."
authors = ["Laurenz Stampfl <laurenz.stampfl@gmail.com>"]
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/LaurenzV/hayro"
license = "Apache-2.0 OR MIT"
readme = "README.md"

[features]
default = ["std", "images"]
std = ["hayro-ccitt?/std", "hayro-jbig2?/std", "hayro-jpeg2000?/std", "dep:rustc-hash", "zune-jpeg?/std"]
images = ["dep:zune-jpeg", "dep:hayro-ccitt", "dep:hayro-jbig2", "dep:hayro-jpeg2000"]
unsafe = ["std", "dep:zlib-rs", "dep:memchr", "hayro-jbig2?/simd", "hayro-jpeg2000?/simd", "zune-jpeg?/x86", "zune-jpeg?/neon"]

[dependencies]
rustc-hash = { version = "2", optional = true }
smallvec = "1"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
zlib-rs = { version = "0.6.8", default-features = false, features = ["rust-allocator"], optional = true }
memchr = { version = "2.8.0", default-features = false, features = ["alloc"], optional = true }
zune-jpeg = { version = "0.5", default-features = false, optional = true }

# The sibling codecs must match the pinned upstream Hayro revision.
hayro-ccitt = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, optional = true }
hayro-jbig2 = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, optional = true }
hayro-jpeg2000 = { git = "https://github.com/LaurenzV/hayro", rev = "e7ada1354dff4041cdeed3d8ba56fe01b6186132", default-features = false, optional = true }

[dev-dependencies]
sha2 = "0.10"
md5 = "0.8"
aes = "0.8.4"
cbc = "0.1.2"
