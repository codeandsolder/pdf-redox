[package]
name = "pdf-redox-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pdf-redox = { path = "../crates/pdf-redox" }

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

# Cargo patches are scoped to the consuming workspace.
[patch."https://github.com/LaurenzV/hayro"]
hayro-syntax = { path = "../third_party/hayro-syntax" }

[patch.crates-io]
fax = { path = "../third_party/fax" }
