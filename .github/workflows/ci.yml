name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust pinned nightly
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@097cc824fc551bce6708700117f796c746689faa # main
    with:
      command: |
        # Fail CI if Renovate updates the manifest but leaves these workflow pins stale.
        declared="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        if [ "$declared" != "$RUST_TOOLCHAIN" ]; then
          echo "CI toolchain $RUST_TOOLCHAIN differs from rust-toolchain.toml ($declared)" >&2
          exit 1
        fi
        cargo fmt --all -- --check
        git diff --check
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked --workspace --all-features
        RUSTDOCFLAGS=-Dwarnings cargo doc --locked --workspace --all-features --no-deps
      rust-toolchain: "nightly-2026-11-22"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  wasm:
    name: WASM compatibility
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@097cc824fc551bce6708700117f796c746689faa # main
    with:
      command: |
        declared="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        test "$declared" = "$RUST_TOOLCHAIN" || { echo "WASM toolchain $RUST_TOOLCHAIN differs from $declared" >&2; exit 1; }
        cargo check --locked -p pdf-redox-wasm --target wasm32-unknown-unknown
      rust-toolchain: "nightly-2026-11-22"
      rust-targets: "wasm32-unknown-unknown"
      rustflags: ""
