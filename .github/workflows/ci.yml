name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msrv:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - name: Check declared MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  rust:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Diff check
        run: git diff --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps


  rust-shared-cache:
    name: Rust 1.99.0 (shared sccache)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@main
    with:
      command: |
        cargo +1.99.0 fmt --all -- --check
        git diff --check
        cargo +1.99.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo +1.99.0 test --locked --workspace --all-features
        RUSTDOCFLAGS=-Dwarnings cargo +1.99.0 doc --locked --workspace --all-features --no-deps
      rust-toolchain: "1.99.0"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  wasm:
    name: WASM compatibility
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - name: WASM check
        run: cargo check --locked -p pdf-redox-wasm --target wasm32-unknown-unknown
