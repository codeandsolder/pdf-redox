name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust pinned nightly
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      command: |
        # Check the compiler actually selected, rather than the workflow's environment label.
        declared="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        test "$(rustc --version)" = "$(rustup run "$declared" rustc --version)"
        cargo fmt --all -- --check
        git diff --check
        cargo metadata --locked --format-version 1 > /dev/null
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked --workspace --all-features
        cargo --config 'build.rustdocflags=["-Dwarnings"]' doc --locked --workspace --all-features --no-deps
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  wasm:
    name: WASM compatibility
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      command: |
        declared="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        test "$(rustc --version)" = "$(rustup run "$declared" rustc --version)"
        bash .github/scripts/test-wasm.sh
      rust-targets: "wasm32-unknown-unknown"
      rustflags: ""

  merge-gate:
    name: Rust CI merge gate
    if: ${{ always() }}
    needs: [rust, wasm]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["rust","success"],["wasm","success"]]'
