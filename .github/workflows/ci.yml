name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust 1.99 nightly
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@7c04e549f943d270978b0302b278771ae6e2e40d # main
    with:
      command: |
        cargo +nightly-2026-08-01 fmt --all -- --check
        git diff --check
        cargo +nightly-2026-08-01 clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo +nightly-2026-08-01 test --locked --workspace --all-features
        RUSTDOCFLAGS=-Dwarnings cargo +nightly-2026-08-01 doc --locked --workspace --all-features --no-deps
      rust-toolchain: "nightly-2026-08-01"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  wasm:
    name: WASM compatibility
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@7c04e549f943d270978b0302b278771ae6e2e40d # main
    with:
      command: cargo +nightly-2026-08-01 check --locked -p pdf-redox-wasm --target wasm32-unknown-unknown
      rust-toolchain: "nightly-2026-08-01"
      rust-targets: "wasm32-unknown-unknown"
      rustflags: ""
