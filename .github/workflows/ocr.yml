name: OCR companion

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ocr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-smoke:
    name: Python OCR lint and Poppler geometry tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Lint Python
        run: |
          uvx ruff check --select E4,E7,E9,F ocr
          uvx ruff format --check ocr
          bash -n ocr/run-auto.sh
      - name: Test parser, paint isolation and Poppler geometry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          uv run --python 3.12 ocr/tests/test_pdf_geometry.py
          uv run --python 3.12 ocr/tests/test_mask_native_text.py
          uv run --python 3.12 ocr/tests/test_mask_paint_invocations.py
