name: Strict Rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@cb9083676196a8ec3bf013e7253907b2759020c7 # main

  merge-gate:
    name: Strict Rust merge gate
    if: ${{ always() }}
    needs: [strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@f22d2e61394d5b0b79314d24d16523eed509d496 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["strict-rust","success"]]'
