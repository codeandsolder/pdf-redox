name: Strict Rust

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strict-rust:
    uses: codeandsolder/rust-skills2/.github/workflows/strict-rust.yml@6e3473415ed6be9cf25869ddeac80304ddb5a34b # main

  merge-gate:
    name: Strict Rust merge gate
    if: ${{ always() }}
    needs: [strict-rust]
    uses: codeandsolder/ci-workflows/.github/workflows/merge-gate.yml@1293f1c247f07a14a85859f908b4f6b7e2553922 # main
    with:
      needs-json: ${{ toJSON(needs) }}
      expected-results: '[["strict-rust","success"]]'
